[project]
name = "chaihouse-feedback-agent"
version = "0.1.0"
description = "Local-first customer feedback triage and analytics prototype for Chai House."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "httpx>=0.27,<1.0",
  "langgraph>=0.2,<2.0",
  "qrcode[pil]>=8.0,<9.0",
  "reportlab>=4.2,<5.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
